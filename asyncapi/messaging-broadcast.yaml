            topic: user:0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
  schemas:
    BroadcastNewMessage:
      description: NewMessage is sent to every instance of messaging when a message is created, so each one pushes it to the sockets it holds.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^channel:.+
        event:
          type: string
          enum:
            - new_message
        payload:
          type: object
          properties:
            id:
              type: string
            channel_id:
              type: string
            server_id:
              type: [string, "null"]
            user_id:
              type: string
            content:
              type: string
            inserted_at:
              type: string
              format: date-time
            edited:
              type: boolean
            edited_at:
              type: [string, "null"]
              format: date-time
            mentions:
              type: array
              items:
                type: string
            mention_roles:
              type: array
              items:
                type: string
            mention_everyone:
              type: boolean
            attachments:
              type: array
              items:
                type: object
                additionalProperties: {}
            client_id:
              type: string
          required:
            - id
            - channel_id
            - server_id
            - user_id
            - content
            - inserted_at
            - edited
            - edited_at
            - mentions
            - mention_roles
            - mention_everyone
            - attachments
      required: [event_id, topic, event, payload]
    BroadcastMessageUpdated:
      description: MessageUpdated is sent when the text of a message is edited.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^channel:.+
        event:
          type: string
          enum:
            - message_updated
        payload:
          type: object
          properties:
            id:
              type: string
            channel_id:
              type: string
            server_id:
              type: [string, "null"]
            user_id:
              type: string
            content:
              type: string
            inserted_at:
              type: string
              format: date-time
            edited:
              type: boolean
            edited_at:
              type: [string, "null"]
              format: date-time
            mentions:
              type: array
              items:
                type: string
            mention_roles:
              type: array
              items:
                type: string
            mention_everyone:
              type: boolean
            attachments:
              type: array
              items:
                type: object
                additionalProperties: {}
            client_id:
              type: string
          required:
            - id
            - channel_id
            - server_id
            - user_id
            - content
            - inserted_at
            - edited
            - edited_at
            - mentions
            - mention_roles
            - mention_everyone
            - attachments
      required: [event_id, topic, event, payload]
    BroadcastMessageDeleted:
      description: MessageDeleted is sent when a message is deleted. It carries no content.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^channel:.+
        event:
          type: string
          enum:
            - message_deleted
        payload:
          type: object
          properties:
            id:
              type: string
            channel_id:
              type: string
            server_id:
              type: [string, "null"]
            deleted_at:
              type: string
              format: date-time
          required: [id, channel_id, server_id, deleted_at]
      required: [event_id, topic, event, payload]
    BroadcastReactionUpdated:
      description: ReactionUpdated is sent when somebody adds or removes a reaction.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^channel:.+
        event:
          type: string
          enum:
            - reaction_updated
        payload:
          type: object
          properties:
            channel_id:
              type: string
            message_id:
              type: string
            emoji:
              type: string
            user_id:
              type: string
            action:
              type: string
            count:
              type: integer
              minimum: 0
          required: [channel_id, message_id, emoji, user_id, action, count]
      required: [event_id, topic, event, payload]
    BroadcastNewDm:
      description: NewDM is sent to each participant of a direct conversation when a message arrives.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user:.+
        event:
          type: string
          enum:
            - new_dm
        payload:
          type: object
          properties:
            conversation_id:
              type: string
            partner_id:
              type: string
            message:
              type: object
              properties:
                id:
                  type: string
                channel_id:
                  type: string
                server_id:
                  type: [string, "null"]
                user_id:
                  type: string
                content:
                  type: string
                inserted_at:
                  type: string
                  format: date-time
                edited:
                  type: boolean
                edited_at:
                  type: [string, "null"]
                  format: date-time
                mentions:
                  type: array
                  items:
                    type: string
                mention_roles:
                  type: array
                  items:
                    type: string
                mention_everyone:
                  type: boolean
                attachments:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
                client_id:
                  type: string
              required:
                - id
                - channel_id
                - server_id
                - user_id
                - content
                - inserted_at
                - edited
                - edited_at
                - mentions
                - mention_roles
                - mention_everyone
                - attachments
          required: [conversation_id, partner_id, message]
      required: [event_id, topic, event, payload]
    BroadcastMention:
      description: Mention is sent to every user a message mentions, wherever they are.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user:.+
        event:
          type: string
          enum:
            - mention
        payload:
          type: object
          properties:
            server_id:
              type: [string, "null"]
            channel_id:
              type: string
            message:
              type: object
              properties:
                id:
                  type: string
                channel_id:
                  type: string
                server_id:
                  type: [string, "null"]
                user_id:
                  type: string
                content:
                  type: string
                inserted_at:
                  type: string
                  format: date-time
                edited:
                  type: boolean
                edited_at:
                  type: [string, "null"]
                  format: date-time
                mentions:
                  type: array
                  items:
                    type: string
                mention_roles:
                  type: array
                  items:
                    type: string
                mention_everyone:
                  type: boolean
                attachments:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
                client_id:
                  type: string
              required:
                - id
                - channel_id
                - server_id
                - user_id
                - content
                - inserted_at
                - edited
                - edited_at
                - mentions
                - mention_roles
                - mention_everyone
                - attachments
          required: [server_id, channel_id, message]
      required: [event_id, topic, event, payload]
    BroadcastAccessRevoked:
      description: AccessRevoked is sent when a user loses access to a server or a channel, so their open sockets leave it.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^(channel|presence):.+
        event:
          type: string
          enum:
            - access_revoked
        payload:
          type: object
          properties:
            user_id:
              type: string
            reason:
              type: string
            server_id:
              type: string
            channel_id:
              type: string
          required: [user_id, reason]
      required: [event_id, topic, event, payload]
    BroadcastServerLeft:
      description: ServerLeft is sent to a user who stopped being a member, so the client drops the server from its list.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user:.+
        event:
          type: string
          enum:
            - server_left
        payload:
          type: object
          properties:
            server_id:
              type: string
          required: [server_id]
      required: [event_id, topic, event, payload]
    BroadcastServerSuspended:
      description: ServerSuspended is sent to every member when staff suspends the server.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user:.+
        event:
          type: string
          enum:
            - server_suspended
        payload:
          type: object
          properties:
            server_id:
              type: string
          required: [server_id]
      required: [event_id, topic, event, payload]
    BroadcastServerReactivated:
      description: ServerReactivated is sent to every member when staff lifts the suspension.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user:.+
        event:
          type: string
          enum:
