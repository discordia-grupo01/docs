components:
  channelBindings:
    messagingBroadcast:
      amqp:
        is: routingKey
        exchange:
          name: messaging.broadcast
          type: fanout
          durable: true
          autoDelete: false
          vhost: /
  messages:
    BroadcastNewMessage:
      name: BroadcastNewMessage
      title: broadcast.new_message
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BroadcastNewMessage'
      examples:
        - payload:
            event: new_message
            event_id: event-id
            payload:
              attachments:
                - clave: valor
              channel_id: channel-id
              client_id: client-id
              content: content
              edited: true
              edited_at: "2026-11-10T15:00:00Z"
              id: id
              inserted_at: "2026-11-10T15:00:00Z"
              mention_everyone: true
              mention_roles:
                - mention-roles
              mentions:
                - mentions
              server_id: server-id
              user_id: user-id
            topic: channel:0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
    BroadcastMessageUpdated:
      name: BroadcastMessageUpdated
      title: broadcast.message_updated
      contentType: application/json
