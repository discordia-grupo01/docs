asyncapi: 3.0.0
info:
  title: Discordia — Canal interno de messaging
  version: generated
  description: 'Eventos que las instancias de `messaging` se mandan entre sí por el exchange `messaging.broadcast` (fanout, una cola durable por instancia) para que cada una empuje el aviso a los sockets que tiene abiertos. Solo los consume `messaging`: no son parte del bus entre servicios. Documento generado desde `events-contract` con `go run ./cmd/eventsgen docs-sync <carpeta asyncapi>`; no se edita a mano (ver ADR 0001, 0004 y 0006 para el diseño).'
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ.
    variables:
      host:
        default: localhost:5672
defaultContentType: application/json
channels:
  broadcastNewMessage:
    address: broadcast.new_message
    title: broadcast.new_message
    description: NewMessage is sent to every instance of messaging when a message is created, so each one pushes it to the sockets it holds.
    messages:
      broadcastNewMessage:
        $ref: '#/components/messages/BroadcastNewMessage'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMessageUpdated:
    address: broadcast.message_updated
    title: broadcast.message_updated
    description: MessageUpdated is sent when the text of a message is edited.
    messages:
      broadcastMessageUpdated:
        $ref: '#/components/messages/BroadcastMessageUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMessageDeleted:
    address: broadcast.message_deleted
    title: broadcast.message_deleted
    description: MessageDeleted is sent when a message is deleted. It carries no content.
    messages:
      broadcastMessageDeleted:
        $ref: '#/components/messages/BroadcastMessageDeleted'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastReactionUpdated:
    address: broadcast.reaction_updated
    title: broadcast.reaction_updated
    description: ReactionUpdated is sent when somebody adds or removes a reaction.
    messages:
      broadcastReactionUpdated:
        $ref: '#/components/messages/BroadcastReactionUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastNewDm:
    address: broadcast.new_dm
    title: broadcast.new_dm
    description: NewDM is sent to each participant of a direct conversation when a message arrives.
    messages:
      broadcastNewDm:
        $ref: '#/components/messages/BroadcastNewDm'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMention:
    address: broadcast.mention
    title: broadcast.mention
    description: Mention is sent to every user a message mentions, wherever they are.
    messages:
      broadcastMention:
        $ref: '#/components/messages/BroadcastMention'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastAccessRevoked:
    address: broadcast.access_revoked
    title: broadcast.access_revoked
    description: AccessRevoked is sent when a user loses access to a server or a channel, so their open sockets leave it.
    messages:
      broadcastAccessRevoked:
        $ref: '#/components/messages/BroadcastAccessRevoked'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastServerLeft:
    address: broadcast.server_left
    title: broadcast.server_left
    description: ServerLeft is sent to a user who stopped being a member, so the client drops the server from its list.
    messages:
      broadcastServerLeft:
        $ref: '#/components/messages/BroadcastServerLeft'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastServerSuspended:
    address: broadcast.server_suspended
    title: broadcast.server_suspended
    description: ServerSuspended is sent to every member when staff suspends the server.
    messages:
      broadcastServerSuspended:
        $ref: '#/components/messages/BroadcastServerSuspended'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastServerReactivated:
    address: broadcast.server_reactivated
    title: broadcast.server_reactivated
    description: ServerReactivated is sent to every member when staff lifts the suspension.
    messages:
      broadcastServerReactivated:
        $ref: '#/components/messages/BroadcastServerReactivated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastDisconnect:
    address: broadcast.disconnect
    title: broadcast.disconnect
    description: Disconnect makes every instance close the sockets of a user.
    messages:
      broadcastDisconnect:
        $ref: '#/components/messages/BroadcastDisconnect'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastPresenceUpdated:
    address: broadcast.presence_updated
    title: broadcast.presence_updated
    description: PresenceUpdated is sent to whoever should see the connection status of a user.
    messages:
      broadcastPresenceUpdated:
        $ref: '#/components/messages/BroadcastPresenceUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastOwnStatusUpdated:
    address: broadcast.own_status_updated
    title: broadcast.own_status_updated
    description: OwnStatusUpdated is sent to a user's own sockets when they change the status they chose.
    messages:
      broadcastOwnStatusUpdated:
        $ref: '#/components/messages/BroadcastOwnStatusUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
