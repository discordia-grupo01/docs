        payload:
          type: object
          properties:
            server_id:
              type: string
          required: [server_id]
      required: [event_id, topic, event, payload]
    BroadcastDisconnect:
      description: Disconnect makes every instance close the sockets of a user.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^user_socket:.+
        event:
          type: string
          enum:
            - disconnect
        payload:
          type: object
          properties: {}
      required: [event_id, topic, event, payload]
    BroadcastPresenceUpdated:
      description: PresenceUpdated is sent to whoever should see the connection status of a user.
      type: object
      properties:
        event_id:
          type: string
        topic:
          type: string
          pattern: ^(presence|user):.+
