              id: id
              inserted_at: "2026-11-10T15:00:00Z"
              mention_everyone: true
              mention_roles:
                - mention-roles
              mentions:
                - mentions
              server_id: server-id
              user_id: user-id
            topic: channel:0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
    BroadcastMessageDeleted:
      name: BroadcastMessageDeleted
      title: broadcast.message_deleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BroadcastMessageDeleted'
      examples:
        - payload:
            event: message_deleted
            event_id: event-id
            payload:
              channel_id: channel-id
