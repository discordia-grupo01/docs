asyncapi: 3.0.0

info:
  title: Discordia — Event Bus
  version: 0.6.0
  description: |
    Eventos de dominio que viajan por RabbitMQ entre los servicios de
    Discordia (ADR-07).

    - Exchange `discordia.events`, tipo `topic`, durable.
    - Routing key `<servicio>.<acción en pasado>` (ej. `servers.member_joined`,
      `users.profile_updated`).
    - Mensajes `application/json`, persistentes (`delivery_mode = 2`).
    - Garantía at-least-once: los publishers usan outbox transaccional y los
      consumidores deben ser **idempotentes** (deduplicar por `event_id`) y
      tolerar **desorden** (usar `occurred_at`, o `version` en los eventos que
      la tienen). No hay replay nativo.
    - Una cola durable por servicio consumidor, con ack manual.

    Este documento es la fuente de verdad del schema. Las implementaciones Go
    viven en [`events-contract`](https://github.com/discordia-grupo01/events-contract):
    un cambio de schema se hace primero acá y después se replica allá.

servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ (local vía docker-compose; en la nube, CloudAMQP).
    variables:
      host:
        default: localhost:5672

defaultContentType: application/json

channels:
  platformStatusChanged:
    address: platform.status_changed
    title: platform.status_changed
    description: |
      Metrics publica este aviso al publicar o resolver un incidente. No
      transporta el incidente completo: notifications lo difunde por el tópico
      `platform` para que los clientes vuelvan a consultar `GET /v1/status`.
    messages:
      platformStatusChanged:
        $ref: '#/components/messages/PlatformStatusChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  platformHealthChanged:
    address: platform.health_changed
    title: platform.health_changed
    description: |
      Metrics publica este evento cuando un health check cambia entre
      `operational` y `degraded`. La audiencia contiene únicamente usuarios
      staff; notifications lo entrega por sus tópicos privados para sugerir
      la creación de un incidente.
    messages:
      platformHealthChanged:
        $ref: '#/components/messages/PlatformHealthChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberJoined:
    address: servers.member_joined
    title: servers.member_joined
    description: Un usuario pasó a ser miembro de un servidor (al crearlo como owner o al unirse por invitación).
    messages:
      memberJoined:
        $ref: '#/components/messages/MemberJoined'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberLeft:
    address: servers.member_left
    title: servers.member_left
    description: |
      Un usuario dejó de ser miembro de un servidor: porque lo abandonó o
      porque fue removido (baneado o expulsado). Un ban publica este evento
      **y** `servers.member_banned` en la misma transacción; una expulsión,
      este evento **y** `servers.member_kicked`. Eliminar un servidor publica
      este evento una vez por cada miembro **y** `servers.server_deleted`
      (ver `channels.yaml`) en la misma transacción.
    messages:
      memberLeft:
        $ref: '#/components/messages/MemberLeft'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberBanned:
    address: servers.member_banned
    title: servers.member_banned
    description: |
      Un miembro fue baneado de un servidor (HU #25). Mientras el ban esté
      activo no puede volver a unirse con ninguna invitación. Pensado para que
      Mensajería y Voz corten las sesiones activas del usuario en ese servidor
      y para la auditoría de moderación. El motivo del ban no viaja en el
      evento (minimización de datos).
    messages:
      memberBanned:
        $ref: '#/components/messages/MemberBanned'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberUnbanned:
    address: servers.member_unbanned
    title: servers.member_unbanned
    description: |
      Se revocó el ban de un usuario (HU #26). No lo vuelve a hacer miembro:
      tiene que unirse con una invitación válida, lo que publicará
      `servers.member_joined`.
    messages:
      memberUnbanned:
        $ref: '#/components/messages/MemberUnbanned'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberKicked:
    address: servers.member_kicked
    title: servers.member_kicked
    description: |
      Un miembro fue expulsado de un servidor (HU #59). A diferencia del ban,
      puede volver a unirse con una invitación válida. Pensado para que
      Notificaciones le avise al expulsado. Se publica junto con
      `servers.member_left` en la misma transacción.
    messages:
      memberKicked:
        $ref: '#/components/messages/MemberKicked'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberMuted:
    address: servers.member_muted
    title: servers.member_muted
    description: Un miembro queda temporalmente impedido de enviar mensajes y publicar audio, pero conserva su sesión y puede recibir información.
    messages:
      memberMuted:
        $ref: '#/components/messages/MemberMuted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  memberUnmuted:
    address: servers.member_unmuted
    title: servers.member_unmuted
    description: Se restablece la capacidad de enviar mensajes y publicar audio, manualmente o por expiración.
    messages:
      memberUnmuted:
        $ref: '#/components/messages/MemberUnmuted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  wordFilterUpdated:
    address: servers.word_filter_updated
    title: servers.word_filter_updated
    description: Cambió la lista de palabras prohibidas de un servidor. Es la lista completa (vacía si se borraron todas), no un diff; el consumidor se queda con la de occurred_at más nuevo.
    messages:
      wordFilterUpdated:
        $ref: '#/components/messages/WordFilterUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  reportUpdated:
    address: servers.report_updated
    title: servers.report_updated
    description: |
      Foto de un reporte de usuario o de mensaje hecho dentro de un servidor.
      Existe para el expediente de investigación del backoffice (HU #81,
      `admin`). `servers` lo publica al crear el reporte (`status: pending`) y
      al cerrarlo (`resolved` o `dismissed`, con `resolved_at`), en la misma
      transacción que el cambio. Es la foto completa, no un diff: el
      consumidor se queda con la de `occurred_at` más nuevo para cada
      `report_id`. Para los reportes que ya existían, `servers` re-publica una
      foto por reporte con una migración (backfill, `0034`).

      `kind` dice qué se reportó: con `user` viaja `reported_user_id` y
      `channel_id`/`message_id` van en `null`; con `message` viajan
      `channel_id` y `message_id` y `reported_user_id` va en `null` (el autor
      del mensaje lo resuelve `admin` al leer, cruzando con la actividad de
      mensajes). Todas las claves viajan siempre.

      **No** lleva quién reportó ni quién resolvió el reporte: el expediente
      no los necesita (minimización de datos).
    messages:
      reportUpdated:
        $ref: '#/components/messages/ReportUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  moderationActionRecorded:
    address: servers.moderation_action_recorded
    title: servers.moderation_action_recorded
    description: |
      Se registró una acción de moderación de servidor (ban, revocación de
      ban, expulsión, silencio o fin de silencio) sobre un usuario. `servers`
      lo publica una vez por fila de su auditoría de moderación
      (`moderation_audit_entries`), en la misma transacción, incluido el fin
      automático de un silencio por expiración. `action_id` es el id de esa
      fila: sirve para deduplicar. Para las filas que ya existían, `servers`
      re-publica un evento por fila con una migración (backfill, `0035`).

      Existe aparte de `servers.member_banned`, `member_unbanned`,
      `member_kicked`, `member_muted` y `member_unmuted` porque esos eventos
      disparan efectos (cortar sesiones, silenciar, avisar al usuario): un
      backfill sobre ellos los re-ejecutaría. Este evento solo registra el
      hecho, para el expediente de investigación del backoffice (HU #81,
      `admin`).

      **No** lleva quién ejecutó la acción ni el motivo: el expediente no los
      necesita (minimización de datos).
    messages:
      moderationActionRecorded:
        $ref: '#/components/messages/ModerationActionRecorded'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  profileUpdated:
    address: users.profile_updated
    title: users.profile_updated
    description: |
      Foto completa del perfil público de un usuario (no un diff). identify la
      publica al crear el usuario (registro con email o alta por OAuth) y en
      cada cambio de perfil o de estado personalizado. `version` crece con
      cada cambio del mismo usuario: el consumidor aplica una foto solo si su
      `version` es mayor a la que ya tiene, así que eventos repetidos o fuera
      de orden no pisan datos más nuevos. El email no viaja nunca
      (minimización de datos).
    messages:
      profileUpdated:
        $ref: '#/components/messages/ProfileUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  accountRegistered:
    address: users.account_registered
    title: users.account_registered
    description: |
      Se creó una cuenta. identify lo publica una sola vez por usuario (registro
      con email o alta por OAuth), con los datos de la cuenta que no son perfil
      público: `email`, `name`, `created_at` y `email_verified`. Existe
      únicamente para el listado del backoffice (HU #31, `admin`), que tiene
      que buscar usuarios por email; por eso es la excepción a "el email no
      viaja nunca" de `users.profile_updated`, y ningún otro servicio debería
      consumirlo.
      `email` y `created_at` no cambian, así que no lleva `version`: aplicarlo
      dos veces deja los mismos valores. Para las cuentas que ya existían,
      identify re-publica uno por usuario con una migración (backfill).
      `email_verified` es `true` en las altas por OAuth (el proveedor ya
      verificó el email) y `false` en el registro con email, que queda
      pendiente hasta `users.email_verified`.
    messages:
      accountRegistered:
        $ref: '#/components/messages/AccountRegistered'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  emailVerified:
    address: users.email_verified
    title: users.email_verified
    description: |
      El usuario confirmó su email. identify lo publica una sola vez por
      usuario, cuando se aplica el código de confirmación (las altas por OAuth
      no lo publican: ya nacen verificadas en `users.account_registered`).
      Igual que `users.account_registered`, existe únicamente para el listado
      del backoffice (`admin`), que muestra como "pendiente" a quien todavía
      no confirmó; ningún otro servicio debería consumirlo.
      La verificación no se deshace, así que no lleva `version`: aplicarlo dos
      veces deja lo mismo, y puede llegar antes que `users.account_registered`
      (el consumidor no debe descartarlo por eso). Para las cuentas que ya
      estaban verificadas, identify re-publica uno por usuario con una
      migración (backfill).
    messages:
      emailVerified:
        $ref: '#/components/messages/EmailVerified'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  voiceParticipantJoined:
    address: voice.participant_joined
    title: voice.participant_joined
    description: Un participante autorizado se conectó a un canal de voz.
    messages:
      voiceParticipantJoined:
        $ref: '#/components/messages/VoiceParticipantJoined'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  voiceParticipantLeft:
    address: voice.participant_left
    title: voice.participant_left
    description: Un participante dejó un canal de voz.
    messages:
      voiceParticipantLeft:
        $ref: '#/components/messages/VoiceParticipantLeft'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  voicePrivateCall:
    address: voice.private_call
    title: voice.private_call
    description: |
      Cambio de estado de una llamada privada 1 a 1. Notifications usa el
      evento para entregar push al llamante y al destinatario.
    messages:
      voicePrivateCall:
        $ref: '#/components/messages/VoicePrivateCall'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

operations:
  publishMemberJoined:
    action: send
    title: discordia-servers publica servers.member_joined
    channel:
      $ref: '#/channels/memberJoined'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberLeft:
    action: send
    title: discordia-servers publica servers.member_left
    channel:
      $ref: '#/channels/memberLeft'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberBanned:
    action: send
    title: discordia-servers publica servers.member_banned
    channel:
      $ref: '#/channels/memberBanned'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberUnbanned:
    action: send
    title: discordia-servers publica servers.member_unbanned
    channel:
      $ref: '#/channels/memberUnbanned'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberKicked:
    action: send
    title: discordia-servers publica servers.member_kicked
    channel:
      $ref: '#/channels/memberKicked'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberMuted:
    action: send
    title: discordia-servers publica servers.member_muted
    channel:
      $ref: '#/channels/memberMuted'
    bindings:
      amqp:
        deliveryMode: 2

  publishMemberUnmuted:
    action: send
    title: discordia-servers publica servers.member_unmuted
    channel:
      $ref: '#/channels/memberUnmuted'
    bindings:
      amqp:
        deliveryMode: 2

  publishWordFilterUpdated:
    action: send
    title: discordia-servers publica servers.word_filter_updated
    channel:
      $ref: '#/channels/wordFilterUpdated'
    bindings:
      amqp:
        deliveryMode: 2

  publishReportUpdated:
    action: send
    title: discordia-servers publica servers.report_updated
    channel:
      $ref: '#/channels/reportUpdated'
    bindings:
      amqp:
        deliveryMode: 2

  publishModerationActionRecorded:
    action: send
    title: discordia-servers publica servers.moderation_action_recorded
    channel:
      $ref: '#/channels/moderationActionRecorded'
    bindings:
      amqp:
        deliveryMode: 2

  publishProfileUpdated:
    action: send
    title: discordia-identify publica users.profile_updated
    channel:
      $ref: '#/channels/profileUpdated'
    bindings:
      amqp:
        deliveryMode: 2

  publishAccountRegistered:
    action: send
    title: discordia-identify publica users.account_registered
    channel:
      $ref: '#/channels/accountRegistered'
    bindings:
      amqp:
        deliveryMode: 2

  publishEmailVerified:
    action: send
    title: discordia-identify publica users.email_verified
    channel:
      $ref: '#/channels/emailVerified'
    bindings:
      amqp:
        deliveryMode: 2

  publishVoiceParticipantJoined:
    action: send
    title: voice-sfu publica voice.participant_joined
    channel:
      $ref: '#/channels/voiceParticipantJoined'
    bindings:
      amqp:
        deliveryMode: 2

  publishVoiceParticipantLeft:
    action: send
    title: voice-sfu publica voice.participant_left
    channel:
      $ref: '#/channels/voiceParticipantLeft'
    bindings:
      amqp:
        deliveryMode: 2

  publishVoicePrivateCall:
    action: send
    title: voice-sfu publica voice.private_call
    channel:
      $ref: '#/channels/voicePrivateCall'
    bindings:
      amqp:
        deliveryMode: 2

  identifyReceiveMemberJoined:
    action: receive
    title: discordia-identify consume servers.member_joined
    description: Cola `identify.server_memberships`.
    channel:
      $ref: '#/channels/memberJoined'
    bindings:
      amqp:
        ack: true

  identifyReceiveMemberLeft:
    action: receive
    title: discordia-identify consume servers.member_left
    description: Cola `identify.server_memberships`.
    channel:
      $ref: '#/channels/memberLeft'
    bindings:
      amqp:
        ack: true

  serversReceiveProfileUpdated:
    action: receive
    title: discordia-servers consume users.profile_updated
    description: |
      Cola `servers.user_profiles`. Mantiene la réplica `user_profiles` que
      usa `GET /v1/servers/{serverId}/members` para devolver el perfil de cada
      miembro sin llamar a identify.
    channel:
      $ref: '#/channels/profileUpdated'
    bindings:
      amqp:
        ack: true

  messagingReceiveProfileUpdated:
    action: receive
    title: discordia-messaging consume users.profile_updated
    description: |
      Cola `messaging.channel_lifecycle`. Guarda `user_id` y `version` de cada
      usuario para contestar localmente si existe (primer mensaje directo y
      bloqueos), sin llamar a identify. Aplica la foto solo si su `version` es
      mayor a la que ya tiene.
    channel:
      $ref: '#/channels/profileUpdated'
    bindings:
      amqp:
        ack: true

  adminReceiveAccountRegistered:
    action: receive
    title: discordia-admin consume users.account_registered
    description: |
      Cola `admin.users`. Da de alta al usuario en la réplica `users` del
      backoffice con su email, nombre, fecha de registro y si ya verificó el
      email. Un usuario no aparece en el listado hasta recibir este evento, y
      aparece como "pendiente" mientras su email no esté verificado. Un
      `email_verified: false` nunca pisa una verificación que ya llegó.
    channel:
      $ref: '#/channels/accountRegistered'
    bindings:
      amqp:
        ack: true

  adminReceiveProfileUpdated:
    action: receive
    title: discordia-admin consume users.profile_updated
    description: |
      Cola `admin.users`. Mantiene actualizado el nombre del usuario en el
      listado del backoffice. Aplica la foto solo si su `version` es mayor a la
      que ya tiene.
    channel:
      $ref: '#/channels/profileUpdated'
    bindings:
      amqp:
        ack: true

  adminReceiveEmailVerified:
    action: receive
    title: discordia-admin consume users.email_verified
    description: |
      Cola `admin.users`. Marca el email del usuario como verificado en la
      réplica `users` del backoffice: deja de figurar como "pendiente". Si el
      usuario todavía no está en la réplica, crea la fila igual (sin
      `registered_at`, así que no aparece en el listado hasta que llegue
      `users.account_registered`).
    channel:
      $ref: '#/channels/emailVerified'
    bindings:
      amqp:
        ack: true

  adminReceiveMemberJoined:
    action: receive
    title: discordia-admin consume servers.member_joined
    description: |
      Cola `admin.servers`. Suma un miembro al conteo del listado de
      servidores (HU #32) y registra la membresía para la actividad del
      expediente de investigación (HU #81).
    channel:
      $ref: '#/channels/memberJoined'
    bindings:
      amqp:
        ack: true

  adminReceiveMemberLeft:
    action: receive
    title: discordia-admin consume servers.member_left
    description: |
      Cola `admin.servers`. Resta un miembro del conteo del listado de
      servidores (HU #32) y registra la salida para la actividad del
      expediente de investigación (HU #81).
    channel:
      $ref: '#/channels/memberLeft'
    bindings:
      amqp:
        ack: true

  adminReceiveReportUpdated:
    action: receive
    title: discordia-admin consume servers.report_updated
    description: |
      Cola `admin.servers`. Guarda o actualiza el reporte en la réplica del
      expediente de investigación (HU #81). Aplica la foto solo si su
      `occurred_at` es más nuevo que el que ya tiene para ese `report_id`.
    channel:
      $ref: '#/channels/reportUpdated'
    bindings:
      amqp:
        ack: true

  adminReceiveModerationActionRecorded:
    action: receive
    title: discordia-admin consume servers.moderation_action_recorded
    description: |
      Cola `admin.servers`. Agrega la acción de moderación de servidor al
      expediente de investigación (HU #81). Es idempotente: la acción se
      identifica por `action_id`.
    channel:
      $ref: '#/channels/moderationActionRecorded'
    bindings:
      amqp:
        ack: true

  notificationsReceiveMemberJoined:
    action: receive
    title: discordia-notifications consume servers.member_joined
    description: Cola `notifications.unread_state`. Guarda desde cuándo es miembro (lo que se escribió antes no cuenta como no leído).
    channel:
      $ref: '#/channels/memberJoined'
    bindings:
      amqp:
        ack: true

  notificationsReceiveMemberLeft:
    action: receive
    title: discordia-notifications consume servers.member_left
    description: Cola `notifications.unread_state`. Borra la membresía y sus marcas de lectura del servidor.
    channel:
      $ref: '#/channels/memberLeft'
    bindings:
      amqp:
        ack: true

  notificationsReceivePlatformStatusChanged:
    action: receive
    title: discordia-notifications consume platform.status_changed
    description: Difunde un aviso de refetch en el tópico `platform`.
    channel:
      $ref: '#/channels/platformStatusChanged'
    bindings:
      amqp:
        ack: true

  notificationsReceivePlatformHealthChanged:
    action: receive
    title: discordia-notifications consume platform.health_changed
    description: Entrega la sugerencia de health check a cada usuario staff de la audiencia.
    channel:
      $ref: '#/channels/platformHealthChanged'
    bindings:
      amqp:
        ack: true

components:
  channelBindings:
    discordiaEvents:
      amqp:
        is: routingKey
        exchange:
          name: discordia.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /

  messages:
    PlatformStatusChanged:
      name: PlatformStatusChanged
      title: Estado de plataforma modificado
      payload:
        $ref: '#/components/schemas/PlatformStatusChanged'
      examples:
        - payload:
            event_id: 3f9c2a1e-6b1d-4c1a-9a3e-2b7f0c8d9e10
            occurred_at: '2026-11-05T03:30:00Z'
            status: degraded

    PlatformHealthChanged:
      name: PlatformHealthChanged
      title: Health check de plataforma modificado
      payload:
        $ref: '#/components/schemas/PlatformHealthChanged'
      examples:
        - payload:
            event_id: 3f9c2a1e-6b1d-4c1a-9a3e-2b7f0c8d9e10
            occurred_at: '2026-11-05T03:30:00Z'
            service: servers
            previous_status: operational
            status: degraded
            consecutive_failures: 2
            audience_user_ids: [staff-user-id]

    MemberJoined:
      name: MemberJoined
      title: Miembro unido
      payload:
        $ref: '#/components/schemas/MemberJoined'
      examples:
        - payload:
            event_id: 3f9c2a1e-6b1d-4c1a-9a3e-2b7f0c8d9e10
            occurred_at: '2026-09-26T14:30:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            user_id: user-123

    MemberLeft:
      name: MemberLeft
      title: Miembro salió o fue removido
      payload:
        $ref: '#/components/schemas/MemberLeft'
      examples:
        - payload:
            event_id: 8a1d4c2b-3e5f-4a6b-9c7d-1e2f3a4b5c6d
            occurred_at: '2026-09-26T14:35:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            user_id: user-123

    MemberBanned:
      name: MemberBanned
      title: Miembro baneado
      payload:
        $ref: '#/components/schemas/MemberBanned'
      examples:
        - payload:
            event_id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
            occurred_at: '2026-09-26T14:35:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            user_id: user-123
            banned_by: user-456

    MemberUnbanned:
      name: MemberUnbanned
