asyncapi: 3.0.0

info:
  title: Discordia — Channels events
  version: 0.3.0
  description: |
    Eventos del dominio de canales que viajan por RabbitMQ entre `servers`
    (publisher) y `messaging` / `voice-sfu` (consumidores). Documento aparte de
    `asyncapi.yaml` (que cubre membership) porque son dominios distintos con
    ciclos de vida propios -- ver `README.md` para el índice completo.

    - Exchange `discordia.events`, tipo `topic`, durable (el mismo que usa
      membership -- un único exchange para todo el bus de eventos).
    - Routing key `<servicio>.<acción en pasado>` (ej. `servers.channel_created`).
    - Mensajes `application/json`, persistentes (`delivery_mode = 2`).
    - Garantía at-least-once: el publisher usa outbox transaccional y el
      consumidor debe ser **idempotente** (deduplicar por `event_id`) y
      tolerar **desorden** (usar `occurred_at`). No hay replay nativo.
    - Una cola durable por servicio consumidor, con ack manual.

    Este documento es la fuente de verdad del schema. Las implementaciones
    viven en [`events-contract`](https://github.com/discordia-grupo01/events-contract)
    (`channels/events.go` y `channels/events.ex`): un cambio de schema se hace
    primero acá y después se replica allá.

servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ (local vía docker-compose; en la nube, CloudAMQP).
    variables:
      host:
        default: localhost:5672

defaultContentType: application/json

channels:
  channelCreated:
    address: servers.channel_created
    title: servers.channel_created
    description: Se creó un canal (de texto o de voz) dentro de un servidor.
    messages:
      channelCreated:
        $ref: '#/components/messages/ChannelCreated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  channelDeleted:
    address: servers.channel_deleted
    title: servers.channel_deleted
    description: |
      Se eliminó un canal. No transporta el historial de mensajes (vive en
      `messaging`): el consumidor debe purgar/marcar inválido su propio
      read-model para ese `channel_id`.
    messages:
      channelDeleted:
        $ref: '#/components/messages/ChannelDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  serverDeleted:
    address: servers.server_deleted
    title: servers.server_deleted
    description: |
      Se eliminó un servidor de forma permanente. `servers` ya borró sus
      canales, roles, categorías, invitaciones y bans; lo que vive en otros
      servicios lo tiene que purgar cada consumidor. `messaging` borra todos los
      mensajes de esos canales y los saca de su caché de canales. Trae los ids de
      todos los canales que tenía el servidor para que el consumidor no dependa de
      su propia copia. La eliminación publica, en la misma transacción, un
      `servers.member_left` por cada miembro (para quien lleva la membresía) y
      este evento.
    messages:
      serverDeleted:
        $ref: '#/components/messages/ServerDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  serverUpdated:
    address: servers.server_updated
    title: servers.server_updated
    description: |
      Foto completa de un servidor (nombre, dueño y fecha de creación), no un
      diff. `servers` la publica al crear el servidor y en cada cambio de nombre
      o de dueño. No lleva `version`: el consumidor se queda con la foto de
      `occurred_at` más nueva de cada servidor, así que un evento repetido o
      fuera de orden no pisa datos más recientes (misma regla que los eventos
      de `permissions.yaml`). Hoy la consume `admin` para armar el listado de
      servidores del backoffice (HU #32) sin consultar a `servers`. `servers`
      re-publica todos los servidores existentes con una migración (backfill)
      cuando se suma un consumidor.
    messages:
      serverUpdated:
        $ref: '#/components/messages/ServerUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  channelAccessRevoked:
    address: servers.channel_access_revoked
    title: servers.channel_access_revoked
    description: |
      Miembros que podían ver un canal (`VIEW_CHANNELS` después de los
      overrides por rol, HU #57) dejaron de poder verlo. `servers` calcula
      quién ve cada canal antes y después del cambio, dentro de la misma
      transacción, y publica uno por canal afectado (de texto o de voz) con
      `user_ids` = solo quienes **perdieron** el acceso (nunca vacío). Ganar
      acceso no se publica.

      Lo disparan: crear, editar o borrar un override; editar o borrar un rol;
      asignar o quitar un rol; aceptar una transferencia de propiedad (el
      dueño anterior deja de ser administrador implícito); y expulsar, banear
      o abandonar el servidor (en estos tres, además del `servers.member_left`,
      con el miembro en un evento por cada canal que veía).

      Pensado para cortar lo que el usuario tiene abierto en ese canal:
      `messaging` cierra su socket (`access_revoked` con
      `reason: "permissions_changed"`) y `voice-sfu` lo saca de la sala de voz.
      Como solo corta y al reconectar se vuelve a chequear el estado actual, un
      evento repetido o fuera de orden cuesta a lo sumo una reconexión de más:
      los consumidores no necesitan descartar eventos viejos.
    messages:
      channelAccessRevoked:
        $ref: '#/components/messages/ChannelAccessRevoked'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

operations:
  publishChannelCreated:
    action: send
    title: discordia-servers publica servers.channel_created
    channel:
      $ref: '#/channels/channelCreated'
    bindings:
      amqp:
        deliveryMode: 2

  publishChannelDeleted:
    action: send
    title: discordia-servers publica servers.channel_deleted
    channel:
      $ref: '#/channels/channelDeleted'
    bindings:
      amqp:
        deliveryMode: 2

  publishServerDeleted:
    action: send
    title: discordia-servers publica servers.server_deleted
    channel:
      $ref: '#/channels/serverDeleted'
    bindings:
      amqp:
        deliveryMode: 2

  publishServerUpdated:
    action: send
    title: discordia-servers publica servers.server_updated
    channel:
      $ref: '#/channels/serverUpdated'
    bindings:
      amqp:
        deliveryMode: 2

  publishChannelAccessRevoked:
    action: send
    title: discordia-servers publica servers.channel_access_revoked
    channel:
      $ref: '#/channels/channelAccessRevoked'
    bindings:
      amqp:
        deliveryMode: 2

  messagingReceiveChannelCreated:
    action: receive
    title: discordia-messaging consume servers.channel_created
    description: Cola `messaging.channel_lifecycle`.
    channel:
      $ref: '#/channels/channelCreated'
    bindings:
      amqp:
        ack: true

  messagingReceiveChannelDeleted:
    action: receive
    title: discordia-messaging consume servers.channel_deleted
    description: Cola `messaging.channel_lifecycle`.
    channel:
      $ref: '#/channels/channelDeleted'
    bindings:
      amqp:
        ack: true

  messagingReceiveServerDeleted:
    action: receive
    title: discordia-messaging consume servers.server_deleted
    description: Cola `messaging.channel_lifecycle`. Idempotente.
    channel:
      $ref: '#/channels/serverDeleted'
    bindings:
      amqp:
        ack: true

  messagingReceiveChannelAccessRevoked:
    action: receive
    title: discordia-messaging consume servers.channel_access_revoked
    description: |
      Cola `messaging.channel_lifecycle`. Cierra el socket de cada usuario de
      `user_ids` en ese canal. Sin chequeo de eventos viejos (ver el canal).
    channel:
      $ref: '#/channels/channelAccessRevoked'
    bindings:
      amqp:
        ack: true

  voiceReceiveChannelAccessRevoked:
    action: receive
    title: discordia-voice-sfu consume servers.channel_access_revoked
    description: |
      Cola `voice.signaling`. Saca de la sala `voice:<channel_id>` a cada
      usuario de `user_ids` que esté en ella; si LiveKit falla, reencola.
    channel:
      $ref: '#/channels/channelAccessRevoked'
    bindings:
      amqp:
        ack: true

  voiceReceiveChannelDeleted:
    action: receive
    title: discordia-voice-sfu consume servers.channel_deleted
    description: Cola `voice.signaling`. Cierra la sala `voice:<channel_id>` con todos adentro.
    channel:
      $ref: '#/channels/channelDeleted'
    bindings:
      amqp:
        ack: true

  voiceReceiveServerDeleted:
    action: receive
    title: discordia-voice-sfu consume servers.server_deleted
    description: Cola `voice.signaling`. Cierra la sala de cada canal de `channel_ids`.
    channel:
      $ref: '#/channels/serverDeleted'
    bindings:
      amqp:
        ack: true

  adminReceiveServerUpdated:
    action: receive
    title: discordia-admin consume servers.server_updated
    description: |
      Cola `admin.servers`. Mantiene la réplica `servers` del backoffice
      (nombre, dueño, fecha de creación) para el listado de servidores.
      Aplica la foto solo si su `occurred_at` es más nuevo que el guardado.
    channel:
      $ref: '#/channels/serverUpdated'
    bindings:
      amqp:
        ack: true

  adminReceiveServerDeleted:
    action: receive
    title: discordia-admin consume servers.server_deleted
    description: Cola `admin.servers`. Borra el servidor y sus membresías de la réplica del backoffice.
    channel:
      $ref: '#/channels/serverDeleted'
    bindings:
      amqp:
        ack: true

  notificationsReceiveChannelCreated:
    action: receive
    title: discordia-notifications consume servers.channel_created
    description: Cola `notifications.unread_state`. Guarda el canal en la réplica para saber a qué servidor pertenece.
    channel:
      $ref: '#/channels/channelCreated'
    bindings:
      amqp:
        ack: true

  notificationsReceiveChannelDeleted:
    action: receive
    title: discordia-notifications consume servers.channel_deleted
    description: Cola `notifications.unread_state`. Borra el canal, su actividad y las marcas de lectura.
    channel:
      $ref: '#/channels/channelDeleted'
    bindings:
      amqp:
        ack: true

  notificationsReceiveServerDeleted:
    action: receive
    title: discordia-notifications consume servers.server_deleted
    description: Cola `notifications.unread_state`. Borra el servidor, sus canales y las marcas de lectura. Idempotente.
    channel:
      $ref: '#/channels/serverDeleted'
    bindings:
      amqp:
        ack: true

components:
  channelBindings:
    discordiaEvents:
      amqp:
        is: routingKey
        exchange:
          name: discordia.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /

  messages:
    ChannelCreated:
      name: ChannelCreated
      title: Canal creado
      payload:
        $ref: '#/components/schemas/ChannelCreated'
      examples:
        - payload:
            event_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            occurred_at: '2026-09-28T14:30:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            channel_id: 6d5c4b3a-2e1f-4a0b-9c8d-7e6f5a4b3c2d
            name: general
            kind: text

    ChannelDeleted:
      name: ChannelDeleted
      title: Canal eliminado
      payload:
        $ref: '#/components/schemas/ChannelDeleted'
      examples:
        - payload:
            event_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
            occurred_at: '2026-09-28T15:00:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            channel_id: 6d5c4b3a-2e1f-4a0b-9c8d-7e6f5a4b3c2d

    ServerDeleted:
      name: ServerDeleted
      title: Servidor eliminado
      payload:
        $ref: '#/components/schemas/ServerDeleted'
      examples:
        - payload:
            event_id: 3c4d5e6f-7a8b-4c9d-8e0f-2a3b4c5d6e7f
            occurred_at: '2026-10-02T18:00:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            channel_ids:
              - 6d5c4b3a-2e1f-4a0b-9c8d-7e6f5a4b3c2d
              - 7e6d5c4b-3a2f-4b1c-8d9e-8f7a6b5c4d3e

    ServerUpdated:
      name: ServerUpdated
      title: Servidor creado o actualizado
      payload:
        $ref: '#/components/schemas/ServerUpdated'
      examples:
        - payload:
            event_id: 5e6f7a8b-9c0d-4e1f-8a2b-4c5d6e7f8a9b
            occurred_at: '2026-10-14T18:00:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            name: Mi comunidad
            owner_id: 7c1e5a3b-9d2f-4b8e-a6c4-3f1e9d7b5a2c
            created_at: '2026-09-26T14:30:00Z'

    ChannelAccessRevoked:
      name: ChannelAccessRevoked
      title: Acceso a canal revocado
      payload:
        $ref: '#/components/schemas/ChannelAccessRevoked'
      examples:
        - payload:
            event_id: 4d5e6f7a-8b9c-4d0e-9f1a-3b4c5d6e7f8a
            occurred_at: '2026-10-08T20:00:00Z'
            server_id: 0b6f1c8e-7a2d-4e3f-9c1b-5d4a3e2f1a0b
            channel_id: 6d5c4b3a-2e1f-4a0b-9c8d-7e6f5a4b3c2d
            user_ids:
              - 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  schemas:
    Meta:
      type: object
      description: Campos comunes a todo evento (`envelope.Meta` en events-contract).
      required: [event_id, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.

    ChannelCreated:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [server_id, channel_id, name, kind]
          properties:
            server_id:
              type: string
              format: uuid
            channel_id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              enum: [text, voice]

    ChannelDeleted:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [server_id, channel_id]
          properties:
            server_id:
              type: string
              format: uuid
            channel_id:
              type: string
              format: uuid

    ServerDeleted:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [server_id, channel_ids]
          properties:
            server_id:
              type: string
              format: uuid
            channel_ids:
              type: array
              description: Ids de todos los canales (texto y voz) que tenía el servidor. Puede ser vacío, nunca null.
              items:
                type: string
                format: uuid

    ServerUpdated:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [server_id, name, owner_id, created_at]
          properties:
            server_id:
              type: string
              format: uuid
            name:
              type: string
            owner_id:
              type: string
              description: ID del dueño del servidor (emitido por discordia-identify).
            created_at:
              type: string
              format: date-time
              description: Fecha de creación del servidor, ISO 8601 en UTC. No cambia entre fotos.

    ChannelAccessRevoked:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [server_id, channel_id, user_ids]
          properties:
            server_id:
              type: string
              format: uuid
            channel_id:
              type: string
              format: uuid
            user_ids:
              type: array
              description: Usuarios que perdieron el acceso a ese canal. Nunca vacío, sin repetidos.
              minItems: 1
              uniqueItems: true
              items:
                type: string
