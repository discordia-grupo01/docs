asyncapi: 3.0.0

info:
  title: Discordia — Billing events
  version: 0.1.0
  description: |
    Eventos que `billing` publica sobre Premium, que se vende como suscripción
    mensual con Mercado Pago. Documento aparte de `asyncapi.yaml` porque es un
    dominio distinto -- ver `README.md` para el índice completo.

    - Exchange `discordia.events`, tipo `topic`, durable (el mismo que usa el
      resto del bus).
    - Routing key `billing.<qué cambió>`.
    - Mensajes `application/json`, persistentes (`delivery_mode = 2`).
    - Garantía at-least-once: `billing` usa outbox transaccional y escribe el
      evento en la misma transacción que el cambio de Premium.
    - Una cola durable por servicio consumidor, con ack manual.

    **Qué es Premium para el resto.** `billing` es el único que habla con
    Mercado Pago y decide si un usuario es Premium. Los demás servicios
    guardan una réplica con este evento, igual que la de usuarios
    suspendidos. Premium no viaja en el JWT porque el access token dura 15
    minutos y el cambio no se vería al instante.

    **Foto completa.** Cada evento trae todo el estado de Premium del
    usuario, no un diff. El consumidor aplica `active`. Cuando pasa
    `premium_until` (renovación fallida o fin del mes pagado después de
    cancelar), `billing` publica otra foto con `active = false`, así que el
    consumidor no necesita comparar fechas. `premium_until` y `renews` son
    para mostrar.

    **Orden y repeticiones.** `version` crece con cada foto del mismo
    usuario. El consumidor aplica un evento solo si su `version` es mayor a
    la que ya tiene: uno repetido o fuera de orden es inofensivo.

    **Firma.** Como los eventos de `admin.yaml`, este va firmado: un evento
    falso regalaría Premium, y RabbitMQ no impide que otro cliente con
    credenciales del broker publique una routing key `billing.*`. `billing` y
    cada consumidor comparten el secreto `BILLING_EVENTS_HMAC_SECRET`.

    - `signature` = hex(HMAC-SHA256(secreto, texto)), donde `texto` es la
      concatenación, separada por saltos de línea (`\n`), de: routing key,
      `event_id`, `user_id`, `active` (`true`/`false`), `premium_until`
      (cadena vacía si es `null`), `renews` (`true`/`false`), `version`
      (decimal) y `occurred_at`.
    - Las fechas van en UTC con `RFC3339Nano`, es decir sin ceros finales en
      los nanosegundos. El consumidor firma los strings tal como llegaron en
      el JSON, sin volver a formatearlos.
    - El consumidor verifica la firma **antes** de tocar nada, con comparación
      de tiempo constante. Si falta, no es hex o no coincide, descarta el
      evento (ack, sin reencolar) y lo registra. Un secreto vacío nunca
      verifica.
    - `events-contract` (`billing/events.go`) trae `Sign` y `Verify`, y
      `billing/events.ex` el binding de Elixir: usarlos en vez de
      reimplementar el algoritmo.

    Las structs de Go de `events-contract` son la fuente de verdad de los campos, tipos y
    formatos: de ahí se generan los JSON Schema y se comprueba este documento en el CI
    (`eventsgen docs-check`). Acá se explica el sentido de cada evento; un cambio de
    campos se hace primero en `events-contract`.

servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ (local vía docker-compose; en producción, una instancia propia en una VM de Oracle).
    variables:
      host:
        default: localhost:5672

defaultContentType: application/json

channels:
  premiumUpdated:
    address: billing.premium_updated
    title: billing.premium_updated
    description: |
      Cambió el Premium de un usuario. Se publica cuando:

      - se aprueba un cobro (primer mes o renovación) y `premium_until` avanza;
      - la suscripción deja de renovarse (el usuario cancela o Mercado Pago la
        cancela o pausa);
      - se devuelve un cobro o tiene un contracargo: Premium termina en el
        momento;
      - pasa `premium_until` sin un cobro nuevo: `active` pasa a `false`.
    messages:
      premiumUpdated:
        $ref: '#/components/messages/PremiumUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  billingAccountChanged:
    address: billing.account_changed
    title: billing.account_changed
    description: |
      Cambió algo de la cuenta de un usuario que el cliente muestra: el saldo y los movimientos de
      puntos (`points`), los boosts que tiene (`boosts`) o sus compras (`purchases`). Se publica en
      la misma transacción que el cambio. No lleva datos ni firma: solo dice qué volver a pedir, así
      que un evento repetido o desordenado no hace daño. Notifications se lo empuja al usuario por
      WebSocket. El Premium tiene su propia foto firmada, `billing.premium_updated`.
    messages:
      billingAccountChanged:
        $ref: '#/components/messages/AccountChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

operations:
  publishPremiumUpdated:
    action: send
    title: discordia-billing publica billing.premium_updated
    channel:
      $ref: '#/channels/premiumUpdated'
    bindings:
      amqp:
        deliveryMode: 2

  identifyReceivePremiumUpdated:
    action: receive
    title: discordia-identify consume billing.premium_updated
    description: |
      Cola `identify.billing_events`. Guarda `premium_active` y
      `premium_version` del usuario y, si cambió, publica
      `users.profile_updated` para que el campo `premium` del perfil llegue a
      los demás. Verifica la firma y aplica el evento solo si su `version` es
      mayor a la guardada.
    channel:
      $ref: '#/channels/premiumUpdated'
    bindings:
      amqp:
        ack: true

  messagingReceivePremiumUpdated:
    action: receive
    title: discordia-messaging consume billing.premium_updated
    description: |
      Cola `messaging.billing_events`. Guarda `premium` en `replica_users`
      para subir el límite de tamaño de los adjuntos. Misma regla de firma y
      `version`.
    channel:
      $ref: '#/channels/premiumUpdated'
    bindings:
      amqp:
        ack: true

  publishBillingAccountChanged:
    action: send
    title: discordia-billing publica billing.account_changed
    channel:
      $ref: '#/channels/billingAccountChanged'
    bindings:
      amqp:
        deliveryMode: 2

  notificationsReceiveBillingAccountChanged:
    action: receive
    title: discordia-notifications consume billing.account_changed
    description: |
      Cola `notifications.unread_state`. Empuja un aviso `changed` al tópico del usuario y el cliente
      vuelve a pedir su saldo, sus boosts o sus compras. No guarda nada.
    channel:
      $ref: '#/channels/billingAccountChanged'
    bindings:
      amqp:
        ack: true

components:
  channelBindings:
    discordiaEvents:
      amqp:
        is: routingKey
        exchange:
          name: discordia.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /

  messages:
    PremiumUpdated:
      name: PremiumUpdated
      title: Premium actualizado
      payload:
        $ref: '#/components/schemas/PremiumUpdated'
      # Las firmas de los ejemplos son ilustrativas (no verifican con ningún secreto real).
      examples:
        - name: activo
          summary: Primer cobro aprobado, renueva todos los meses.
          payload:
            event_id: 3f6c2a1e-8b4d-4e7a-9c1f-2d5b8e7a6c4f
            occurred_at: '2026-11-03T12:30:45.123456Z'
            user_id: 7c1e5a3b-9d2f-4b8e-a6c4-3f1e9d7b5a2c
            active: true
            premium_until: '2026-12-03T12:30:45Z'
            renews: true
            version: 1
            signature: 2b7e9f1a3c5d7e9b1f3a5c7d9e1b3f5a7c9d1e3b9f2b0c4e7a1d3b5f8e6a2c4d
        - name: vencido
          summary: Pasó premium_until sin un cobro nuevo.
          payload:
            event_id: 4a7d3b2f-9c5e-4f8b-8d2a-3e6c9f8b7d5a
            occurred_at: '2027-01-03T12:31:00Z'
            user_id: 7c1e5a3b-9d2f-4b8e-a6c4-3f1e9d7b5a2c
            active: false
            premium_until: '2027-01-03T12:30:45Z'
            renews: false
            version: 4
            signature: 5c7d9e1b3f5a7c9d1e3b9f2b0c4e7a1d3b5f8e6a2c4d2b7e9f1a3c5d7e9b1f3a

    AccountChanged:
      name: AccountChanged
      title: Cambio en la cuenta de un usuario
      payload:
        $ref: '#/components/schemas/AccountChanged'
      examples:
        - payload:
            event_id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
            occurred_at: '2026-11-11T16:00:00Z'
            user_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
            resource: points

  schemas:
    Meta:
      type: object
      description: Campos comunes a todo evento (`envelope.Meta` en events-contract).
      required: [event_id, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.

    PremiumUpdated:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario (ID de discordia-identify).
        active:
          type: boolean
          description: Si el usuario tiene Premium ahora. Es lo único que el consumidor necesita aplicar.
        premium_until:
          type: [string, "null"]
          format: date-time
          description: Hasta cuándo está pago, en UTC. `null` si nunca pagó.
        renews:
          type: boolean
          description: Si Mercado Pago va a volver a cobrar al llegar `premium_until`.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Crece con cada foto del mismo usuario; ordena los eventos.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, active, premium_until, renews, version, signature]

    AccountChanged:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario al que se le avisa (ID de discordia-identify).
        resource:
          type: string
          enum:
            - points
            - boosts
            - purchases
          description: 'Qué volver a pedir: el saldo de puntos, los boosts del usuario o sus compras.'
      required: [event_id, occurred_at, user_id, resource]
