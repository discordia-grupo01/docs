asyncapi: 3.0.0

info:
  title: Discordia — Admin events
  version: 0.1.0
  description: |
    Eventos que `admin` (el backend del backoffice) publica cuando el staff de
    la plataforma suspende o reactiva una cuenta, o suspende, reactiva o
    elimina un servidor (HU #29, #30, #68 y #69). Documento aparte de
    `asyncapi.yaml` porque es un dominio distinto -- ver `README.md` para el
    índice completo.

    - Exchange `discordia.events`, tipo `topic`, durable (el mismo que usa el
      resto del bus).
    - Routing key `admin.<acción en pasado>`.
    - Mensajes `application/json`, persistentes (`delivery_mode = 2`).
    - Garantía at-least-once: `admin` usa outbox transaccional y escribe el
      evento en la misma transacción que el cambio de estado de la cuenta.
    - Una cola durable por servicio consumidor, con ack manual.

    **Qué provoca una suspensión.** Un usuario suspendido no puede hacer
    nada en la plataforma. Cada servicio que atiende usuarios consume estos
    eventos, guarda localmente quién está suspendido y rechaza (`403
    ACCOUNT_SUSPENDED`) toda acción del usuario, aunque su access token siga
    vigente:

    - `identify`: revoca todos sus refresh tokens y rechaza login y refresh.
    - `servers`: rechaza cualquier acción y oculta su perfil en los miembros.
    - `messaging`: rechaza enviar, editar, reaccionar, adjuntar y mandar DMs,
      niega tickets de socket y cierra sus sockets abiertos.
    - `voice`: niega el token de voz y lo saca de la sala si está conectado.

    **Qué provoca la suspensión de un servidor.** Mientras está suspendido,
    ningún miembro (ni su owner) puede usarlo, pero su contenido se conserva.
    Cada servicio guarda localmente qué servidores están suspendidos:

    - `servers`: rechaza con `403 SERVER_SUSPENDED` toda acción sobre el
      servidor, salvo abandonarlo. El servidor sigue en la lista de los
      miembros, marcado como suspendido.
    - `messaging`: rechaza leer y escribir en sus canales y cierra los sockets
      abiertos de esos canales en todas las instancias. No borra mensajes.
    - `voice`: saca de la sala a quien esté conectado a un canal del servidor.
      La entrada la bloquea `servers` al pedir el token de voz.

    La reactivación levanta el bloqueo en `servers` y en `messaging`; `voice`
    no necesita hacer nada.

    **Qué provoca la eliminación de un servidor.** `admin.server_deletion_requested`
    es un **pedido** firmado, no el hecho consumado: `servers` lo ejecuta (la
    misma cascada que cuando el owner lo elimina) y recién ahí publica
    `servers.server_deleted`, que ya consumen messaging, voice, notifications,
    metrics y el propio admin. Por eso el nombre no termina en `server_deleted`:
    no hay que confundirlo con ese evento. La eliminación es irreversible.

    **Orden y repeticiones.** `version` crece con cada suspensión o
    reactivación del mismo usuario (es el `suspension_version` de admin), o con
    cada suspensión, reactivación o eliminación del mismo servidor (es el
    `moderation_version` de admin). El consumidor aplica un evento solo si su
    `version` es mayor a la que ya tiene: uno repetido o fuera de orden es
    inofensivo. El motivo de la suspensión o de la eliminación no viaja
    (minimización de datos).

    **Firma.** Estos son los únicos eventos firmados: una suspensión falsa
    dejaría a cualquiera sin acceso, una eliminación falsa borraría un servidor
    para siempre, y RabbitMQ no impide que otro cliente con credenciales del
    broker publique una routing key `admin.*`. `admin` y cada consumidor
    comparten el secreto `ADMIN_EVENTS_HMAC_SECRET`.

    - `signature` = hex(HMAC-SHA256(secreto, texto)), donde `texto` es la
      concatenación, separada por saltos de línea (`\n`), de: routing key,
      `event_id`, el identificador del sujeto (`user_id` en los eventos de
      cuenta, `server_id` en los de servidor), `version` (decimal) y
      `occurred_at` (ISO 8601 en UTC con `RFC3339Nano`, es decir sin ceros
      finales en los nanosegundos).
    - Incluir la routing key evita reusar una firma de suspensión como si fuera
      de reactivación o de eliminación, y una firma de cuenta como si fuera de
      servidor.
    - El consumidor verifica la firma **antes** de tocar nada, con comparación
      de tiempo constante. Si falta, no es hex o no coincide, descarta el
      evento (ack, sin reencolar) y lo registra. Un secreto vacío nunca
      verifica.
    - `events-contract` (`admin/events.go`) trae `Sign` y `Verify`: usarlos en
      vez de reimplementar el algoritmo.

    **Arranque de un consumidor nuevo.** RabbitMQ no guarda lo publicado antes
    de que existiera su cola. `admin` incluye un comando que re-publica un
    `admin.user_suspended` (con la `version` vigente) por cada usuario
    suspendido, y un `admin.server_suspended` por cada servidor suspendido; se
    corre después de desplegar un consumidor nuevo.

    Las structs de Go de `events-contract` son la fuente de verdad de los campos, tipos y
    formatos: de ahí se generan los JSON Schema y se comprueba este documento en el CI
    (`eventsgen docs-check`). Acá se explica el sentido de cada evento; un cambio de
    campos se hace primero en `events-contract`.

servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ (local vía docker-compose; en la nube, CloudAMQP).
    variables:
      host:
        default: localhost:5672

defaultContentType: application/json

channels:
  staffMemberAdded:
    address: admin.staff_member_added
    title: admin.staff_member_added
    description: Foto firmada de un miembro de staff para proyecciones locales.
    messages:
      staffMemberAdded:
        payload:
          type: object
          required: [event_id, occurred_at, user_id, signature]
          properties:
            event_id: { type: string, format: uuid }
            occurred_at: { type: string, format: date-time }
            user_id: { type: string, format: uuid }
            signature: { type: string }
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  staffMemberRemoved:
    address: admin.staff_member_removed
    title: admin.staff_member_removed
    description: Revocación firmada de un miembro de staff.
    messages:
      staffMemberRemoved:
        payload:
          type: object
          required: [event_id, occurred_at, user_id, signature]
          properties:
            event_id: { type: string, format: uuid }
            occurred_at: { type: string, format: date-time }
            user_id: { type: string, format: uuid }
            signature: { type: string }
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  userSuspended:
    address: admin.user_suspended
    title: admin.user_suspended
    description: |
      El staff suspendió una cuenta (HU #29). Se publica en la misma
      transacción que el cambio de estado en `admin`. No se puede suspender a
      un miembro del staff.
    messages:
      userSuspended:
        $ref: '#/components/messages/UserSuspended'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  userReactivated:
    address: admin.user_reactivated
    title: admin.user_reactivated
    description: |
      El staff levantó la suspensión de una cuenta (HU #30). El usuario vuelve a
      poder iniciar sesión y actuar con normalidad, y su perfil público vuelve a
      estar disponible.
    messages:
      userReactivated:
        $ref: '#/components/messages/UserReactivated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  serverSuspended:
    address: admin.server_suspended
    title: admin.server_suspended
    description: |
      El staff suspendió un servidor (HU #69). Se publica en la misma
      transacción que el cambio de estado en `admin`. El contenido del servidor
      se conserva; nadie puede usarlo hasta que se reactive.
    messages:
      serverSuspended:
        $ref: '#/components/messages/ServerSuspended'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  serverReactivated:
    address: admin.server_reactivated
    title: admin.server_reactivated
    description: |
      El staff levantó la suspensión de un servidor (HU #69). Sus miembros
      recuperan el acceso normal.
    messages:
      serverReactivated:
        $ref: '#/components/messages/ServerReactivated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  serverDeletionRequested:
    address: admin.server_deletion_requested
    title: admin.server_deletion_requested
    description: |
      El staff pidió eliminar un servidor (HU #68), después de confirmar con su
      nombre. Es un pedido, no el hecho consumado: `servers` borra el servidor
      con todos sus canales, roles y membresías y publica
      `servers.server_deleted`. Es irreversible.
    messages:
      serverDeletionRequested:
        $ref: '#/components/messages/ServerDeletionRequested'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

  adminBackofficeChanged:
    address: admin.backoffice_changed
    title: admin.backoffice_changed
    description: |
      Cambió algo que el backoffice muestra al staff: usuarios, servidores, reportes, el equipo de
      staff, un expediente o las métricas (`resource`). Lleva la lista de miembros del staff a los
      que hay que avisar (`audience_user_ids`), así notifications no necesita saber quién es staff.
      No lleva datos ni firma: lo peor que puede hacer uno falso es que una pantalla vuelva a pedir
      lo que ya muestra. El de `metrics` sale como mucho una vez cada 3 segundos.
    messages:
      adminBackofficeChanged:
        $ref: '#/components/messages/BackofficeChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'

operations:
  publishUserSuspended:
    action: send
    title: discordia-admin publica admin.user_suspended
    channel:
      $ref: '#/channels/userSuspended'
    bindings:
      amqp:
        deliveryMode: 2

  publishUserReactivated:
    action: send
    title: discordia-admin publica admin.user_reactivated
    channel:
      $ref: '#/channels/userReactivated'
    bindings:
      amqp:
        deliveryMode: 2

  publishServerSuspended:
    action: send
    title: discordia-admin publica admin.server_suspended
    channel:
      $ref: '#/channels/serverSuspended'
    bindings:
      amqp:
        deliveryMode: 2

  publishServerReactivated:
    action: send
    title: discordia-admin publica admin.server_reactivated
    channel:
      $ref: '#/channels/serverReactivated'
    bindings:
      amqp:
        deliveryMode: 2

  publishServerDeletionRequested:
    action: send
    title: discordia-admin publica admin.server_deletion_requested
    channel:
      $ref: '#/channels/serverDeletionRequested'
    bindings:
      amqp:
        deliveryMode: 2

  identifyReceiveUserSuspended:
    action: receive
    title: discordia-identify consume admin.user_suspended
    description: |
      Cola `identify.admin_events`. Marca la cuenta como suspendida y revoca
      todos sus refresh tokens (`RevokeAllForUser`). Desde ese momento rechaza
      login, refresh y cualquier request autenticado, y oculta el perfil
      público. Verifica la firma y aplica el evento solo si su `version` es
      mayor a la guardada.
    channel:
      $ref: '#/channels/userSuspended'
    bindings:
      amqp:
        ack: true

  identifyReceiveUserReactivated:
    action: receive
    title: discordia-identify consume admin.user_reactivated
    description: Cola `identify.admin_events`. Levanta la suspensión (misma regla de firma y `version`).
    channel:
      $ref: '#/channels/userReactivated'
    bindings:
      amqp:
        ack: true

  serversReceiveUserSuspended:
    action: receive
    title: discordia-servers consume admin.user_suspended
    description: |
      Cola `servers.admin_events`. Guarda al usuario en `suspended_users` y
      rechaza toda acción suya; en `GET /members` su perfil sale vacío.
    channel:
      $ref: '#/channels/userSuspended'
    bindings:
      amqp:
        ack: true

  serversReceiveUserReactivated:
    action: receive
    title: discordia-servers consume admin.user_reactivated
    description: Cola `servers.admin_events`. Saca al usuario de `suspended_users`.
    channel:
      $ref: '#/channels/userReactivated'
    bindings:
      amqp:
        ack: true

  messagingReceiveUserSuspended:
    action: receive
    title: discordia-messaging consume admin.user_suspended
    description: |
      Cola `messaging.admin_events`. Rechaza todo lo que haga el usuario,
      niega `POST /v1/socket-tickets` y cierra sus sockets abiertos.
    channel:
      $ref: '#/channels/userSuspended'
    bindings:
      amqp:
        ack: true

  messagingReceiveUserReactivated:
    action: receive
    title: discordia-messaging consume admin.user_reactivated
    description: Cola `messaging.admin_events`. Vuelve a permitir al usuario.
    channel:
      $ref: '#/channels/userReactivated'
    bindings:
      amqp:
        ack: true

  voiceReceiveUserSuspended:
    action: receive
    title: discordia-voice-sfu consume admin.user_suspended
    description: Cola `voice.signaling.<instance_id>.suspensions`. Niega el token de voz y saca al usuario de la sala si está conectado.
    channel:
      $ref: '#/channels/userSuspended'
    bindings:
      amqp:
        ack: true

  voiceReceiveUserReactivated:
    action: receive
    title: discordia-voice-sfu consume admin.user_reactivated
    description: Cola `voice.signaling.<instance_id>.suspensions`. Vuelve a permitir al usuario conectarse a voz.
    channel:
      $ref: '#/channels/userReactivated'
    bindings:
      amqp:
        ack: true

  serversReceiveServerSuspended:
    action: receive
    title: discordia-servers consume admin.server_suspended
    description: |
      Cola `servers.admin_events`. Verifica la firma y, si la `version` es
      mayor a la guardada, marca el servidor como suspendido. Desde entonces
      rechaza con `403 SERVER_SUSPENDED` toda acción sobre el servidor (incluida
      la entrada a voz y la del owner), salvo abandonarlo. El servidor sigue en
      la lista de sus miembros, marcado como suspendido.
    channel:
      $ref: '#/channels/serverSuspended'
    bindings:
      amqp:
        ack: true

  serversReceiveServerReactivated:
    action: receive
    title: discordia-servers consume admin.server_reactivated
    description: Cola `servers.admin_events`. Levanta la suspensión del servidor (misma regla de firma y `version`).
    channel:
      $ref: '#/channels/serverReactivated'
    bindings:
      amqp:
        ack: true

  serversReceiveServerDeletionRequested:
    action: receive
    title: discordia-servers consume admin.server_deletion_requested
    description: |
      Cola `servers.admin_events`. Verifica la firma y elimina el servidor con
      la misma cascada que usa el owner, sin pedir el nombre (la confirmación ya
      la hizo el staff en `admin`). Después publica `servers.server_deleted`.
      Si el servidor ya no existe, confirma el mensaje y no hace nada.
    channel:
      $ref: '#/channels/serverDeletionRequested'
    bindings:
      amqp:
        ack: true

  messagingReceiveServerSuspended:
    action: receive
    title: discordia-messaging consume admin.server_suspended
    description: |
      Cola `messaging.admin_events`. Rechaza leer y escribir en los canales del
      servidor y cierra los sockets abiertos de esos canales en todas las
      instancias. Los mensajes no se borran.
    channel:
      $ref: '#/channels/serverSuspended'
    bindings:
      amqp:
        ack: true

  messagingReceiveServerReactivated:
    action: receive
    title: discordia-messaging consume admin.server_reactivated
    description: Cola `messaging.admin_events`. Vuelve a permitir leer y escribir en los canales del servidor.
    channel:
      $ref: '#/channels/serverReactivated'
    bindings:
      amqp:
        ack: true

  voiceReceiveServerSuspended:
    action: receive
    title: discordia-voice-sfu consume admin.server_suspended
    description: Cola `voice.signaling.<instance_id>.suspensions` (una por réplica). Saca de la sala a quien esté conectado a un canal de voz del servidor.
    channel:
      $ref: '#/channels/serverSuspended'
    bindings:
      amqp:
        ack: true

  publishAdminBackofficeChanged:
    action: send
    title: discordia-admin publica admin.backoffice_changed
    channel:
      $ref: '#/channels/adminBackofficeChanged'
    bindings:
      amqp:
        deliveryMode: 2

  notificationsReceiveAdminBackofficeChanged:
    action: receive
    title: discordia-notifications consume admin.backoffice_changed
    description: |
      Cola `notifications.unread_state`. Empuja un aviso `changed` (`resource: backoffice`, `kind`) al
      tópico de cada miembro del staff de la audiencia. No guarda nada.
    channel:
      $ref: '#/channels/adminBackofficeChanged'
    bindings:
      amqp:
        ack: true

components:
  channelBindings:
    discordiaEvents:
      amqp:
        is: routingKey
        exchange:
          name: discordia.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /

  messages:
    UserSuspended:
      name: UserSuspended
      title: Cuenta suspendida
      payload:
        $ref: '#/components/schemas/UserSuspended'
      # Las firmas de los ejemplos son ilustrativas (no verifican con ningún secreto real).
      examples:
        - payload:
            event_id: 7a8b9c0d-1e2f-4a3b-8c4d-6e7f8a9b0c1d
            occurred_at: '2026-11-02T15:20:10.123456Z'
            user_id: 7c1e5a3b-9d2f-4b8e-a6c4-3f1e9d7b5a2c
            version: 1
            signature: 9f2b0c4e7a1d3b5f8e6a2c4d0b7e9f1a3c5d7e9b1f3a5c7d9e1b3f5a7c9d1e3b

    UserReactivated:
      name: UserReactivated
      title: Cuenta reactivada
      payload:
        $ref: '#/components/schemas/UserReactivated'
      examples:
        - payload:
            event_id: 8b9c0d1e-2f3a-4b4c-9d5e-7f8a9b0c1d2e
            occurred_at: '2026-11-03T09:00:00Z'
            user_id: 7c1e5a3b-9d2f-4b8e-a6c4-3f1e9d7b5a2c
            version: 2
            signature: 1e3b5f7a9c1d3e5b7f9a1c3d5e7b9f1a3c5d7e9b1f3a5c7d9e1b3f5a7c9d1e3b

    ServerSuspended:
      name: ServerSuspended
      title: Servidor suspendido
      payload:
        $ref: '#/components/schemas/ServerSuspended'
      examples:
        - payload:
            event_id: 9c0d1e2f-3a4b-4c5d-8e6f-8a9b0c1d2e3f
            occurred_at: '2026-11-05T15:20:10.123456Z'
            server_id: c3d4e5f6-0a1b-4c2d-9e3f-5a6b7c8d9e0f
            version: 1
            signature: 2f4c6e8a0b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e7b9d1f3a

    ServerReactivated:
      name: ServerReactivated
      title: Servidor reactivado
      payload:
        $ref: '#/components/schemas/ServerReactivated'
      examples:
        - payload:
            event_id: 0d1e2f3a-4b5c-4d6e-9f7a-9b0c1d2e3f4a
            occurred_at: '2026-11-06T09:00:00Z'
            server_id: c3d4e5f6-0a1b-4c2d-9e3f-5a6b7c8d9e0f
            version: 2
            signature: 3a5c7e9b1d3f5b7d9f1b3d5f7b9d1f3b5d7f9b1d3f5b7d9f1b3d5f7b9d1f3b5d

    ServerDeletionRequested:
      name: ServerDeletionRequested
      title: Eliminación de servidor pedida
      payload:
        $ref: '#/components/schemas/ServerDeletionRequested'
      examples:
        - payload:
            event_id: 1e2f3a4b-5c6d-4e7f-8a8b-0c1d2e3f4a5b
            occurred_at: '2026-11-07T18:45:30.5Z'
            server_id: c3d4e5f6-0a1b-4c2d-9e3f-5a6b7c8d9e0f
            version: 3
            signature: 4b6d8f0a2c4e6a8c0e2a4c6e8a0c2e4a6c8e0a2c4e6a8c0e2a4c6e8a0c2e4a6c

    BackofficeChanged:
      name: BackofficeChanged
      title: Cambio en el backoffice
      payload:
        $ref: '#/components/schemas/BackofficeChanged'
      examples:
        - payload:
            event_id: 8c9d0e1f-2a3b-4c4d-8e5f-6a7b8c9d0e1f
            occurred_at: '2026-11-11T16:00:00Z'
            resource: users
            audience_user_ids:
              - 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  schemas:
    Meta:
      type: object
      description: Campos comunes a todo evento (`envelope.Meta` en events-contract).
      required: [event_id, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.

    SuspensionEvent:
      type: object
      required: [user_id, version, signature]
      properties:
        user_id:
          type: string
          format: uuid
          description: Usuario suspendido o reactivado (ID de discordia-identify).
        version:
          type: integer
          format: int64
          minimum: 1
          description: suspension_version del usuario en admin. Crece con cada suspensión o reactivación; ordena los eventos del mismo usuario.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.

    UserSuspended:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario suspendido o reactivado (ID de discordia-identify).
        version:
          type: integer
          format: int64
          minimum: 1
          description: suspension_version del usuario en admin. Crece con cada suspensión o reactivación; ordena los eventos del mismo usuario.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, version, signature]

    UserReactivated:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario suspendido o reactivado (ID de discordia-identify).
        version:
          type: integer
          format: int64
          minimum: 1
          description: suspension_version del usuario en admin. Crece con cada suspensión o reactivación; ordena los eventos del mismo usuario.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, version, signature]

    ServerModerationEvent:
      type: object
      required: [server_id, version, signature]
      properties:
        server_id:
          type: string
          format: uuid
          description: Servidor suspendido, reactivado o a eliminar (ID de discordia-servers).
        version:
          type: integer
          format: int64
          minimum: 1
          description: moderation_version del servidor en admin. Crece con cada suspensión, reactivación o eliminación; ordena los eventos del mismo servidor.
        signature:
          type: string
